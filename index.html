<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10è Aniversari · dPhoto'SB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;--surface:#141416;--surface-2:#1b1b1e;--text:#f5f5f7;--muted:#9a9aa3;
    --accent:#5cc4ff;--accent-soft:rgba(92,196,255,.14);
    --border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.2);
    --radius:3px;--shadow:0 12px 34px rgba(0,0,0,.5);--maxw:1280px;font-synthesis:none;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::selection{background:var(--accent);color:#001018}

  header.site{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(5,5,6,.94);border-bottom:1px solid var(--border)}
  .header-inner{max-width:var(--maxw);margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
  .brand img{height:40px;width:auto;object-fit:contain}
  .brand .fallback{font-weight:800;font-size:20px;letter-spacing:-.5px}
  .brand .fallback span{color:var(--accent)}

  .hero{position:relative;overflow:hidden;border-bottom:1px solid var(--border);padding:clamp(72px,12vw,140px) 24px clamp(64px,10vw,110px)}
  .hero-bg{position:absolute;inset:0;z-index:0;opacity:.38}
  .hero-bg .grid-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));height:100%;gap:0;filter:saturate(1.15) contrast(1.03)}
  .hero-bg .grid-photos div{background-size:cover;background-position:center}
  .hero:after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 38%,rgba(92,196,255,.18),transparent 56%),linear-gradient(180deg,rgba(10,10,11,.48) 0%,rgba(10,10,11,.6) 45%,rgba(10,10,11,.88) 100%)}
  .hero-inner{position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;text-align:center;text-shadow:0 2px 18px rgba(0,0,0,.55)}
  .hero-logo{height:clamp(96px,14vw,184px);width:auto;max-width:90%;object-fit:contain;margin:0 auto 30px;display:block;filter:drop-shadow(0 8px 30px rgba(0,0,0,.65))}
  .hero-logo-fb{font-weight:900;font-size:34px;letter-spacing:-1px;margin-bottom:22px;display:none}
  .hero-logo-fb span{color:var(--accent)}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent-soft);background:var(--accent-soft);padding:7px 16px;border-radius:var(--radius);margin-bottom:24px}
  .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .hero h1{font-weight:900;letter-spacing:-.03em;line-height:.88;font-size:clamp(66px,16vw,196px);color:var(--text)}
  .hero .unit{display:block;font-size:clamp(15px,3.4vw,30px);font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text);margin-top:.25em}
  .hero .sub{font-size:clamp(15px,2.2vw,21px);color:var(--muted);font-weight:500;max-width:620px;margin:22px auto 0}

  .stats{border-bottom:1px solid var(--border);background:var(--surface)}
  .stats-inner{max-width:var(--maxw);margin:0 auto;padding:30px 24px;display:grid;grid-template-columns:repeat(4,1fr)}
  .stat{text-align:center;padding:6px 12px}
  .stat:not(:last-child){border-right:1px solid var(--border)}
  .stat b{display:block;font-size:clamp(28px,4vw,46px);font-weight:800;color:var(--text);line-height:1}
  .stat span{display:block;margin-top:8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

  .about{border-bottom:1px solid var(--border)}
  .about-inner{max-width:860px;margin:0 auto;padding:clamp(44px,7vw,72px) 24px;text-align:center}
  .about-kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .about-text{margin-top:16px;font-size:clamp(16px,2vw,19px);line-height:1.7;color:var(--text)}

  .members-head{max-width:var(--maxw);margin:0 auto;padding:clamp(40px,6vw,64px) 24px 6px}
  .members-head h2{font-size:clamp(24px,3.4vw,38px);font-weight:800;letter-spacing:-.02em}
  .members-head p{margin-top:10px;color:var(--muted);font-size:15px;max-width:560px}

  .controls{position:sticky;top:67px;z-index:40;background:rgba(10,10,11,.9);backdrop-filter:blur(14px);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:20px}
  .controls-inner{max-width:var(--maxw);margin:0 auto;padding:16px 24px;display:flex;flex-direction:column;gap:14px}
  .controls-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .search{position:relative;flex:1;min-width:220px}
  .search input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 16px 12px 42px;border-radius:var(--radius);font-size:15px;outline:none;transition:.2s}
  .search input:focus{border-color:var(--accent)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .sort{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:var(--radius);font-size:14px;outline:none;cursor:pointer}
  .sort:focus{border-color:var(--accent)}
  .clear-btn{font-size:13px;font-weight:600;color:var(--muted);padding:12px 14px;border-radius:var(--radius);border:1px solid var(--border);transition:.2s}
  .clear-btn:hover{color:var(--text);border-color:var(--border-strong)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chips .chips-label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
  .chip{font-size:13px;font-weight:500;padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:.18s;white-space:nowrap}
  .chip:hover{border-color:var(--border-strong);color:var(--text)}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#001018;font-weight:600}

  main{max-width:var(--maxw);margin:0 auto;padding:30px 24px 80px}
  .results-count{font-size:14px;color:var(--muted);margin-bottom:20px}
  .results-count b{color:var(--text)}
  .grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .2s ease,border-color .2s,box-shadow .2s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-3px);border-color:var(--border-strong);box-shadow:var(--shadow)}
  .card .featured{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--surface-2)}
  .card .featured img.work{width:100%;height:100%;object-fit:contain;transition:transform .4s ease}
  .card:hover .featured img.work{transform:scale(1.04)}
  .card .body{padding:14px;display:flex;gap:13px;align-items:center;flex:1;border-top:1px solid var(--border)}
  .card .avatar{width:54px;height:54px;min-width:54px;aspect-ratio:1/1;max-width:none;border-radius:50%;object-fit:cover;border:2px solid var(--border-strong);background:var(--surface-2);flex-shrink:0}
  .card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .card .name{font-size:16.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
  .card .member-num{font-size:12.5px;color:var(--accent);font-weight:600;letter-spacing:.02em}
  .card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
  .tag{font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);padding:4px 9px;border-radius:var(--radius)}
  .empty{text-align:center;padding:80px 20px;color:var(--muted);font-size:16px}

  .modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-overlay.open{opacity:1;pointer-events:auto}
  .modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);width:min(960px,100%);max-height:92vh;overflow-y:auto;position:relative;box-shadow:var(--shadow);transform:translateY(12px);transition:transform .22s ease}
  .modal-overlay.open .modal{transform:translateY(0)}
  .modal-close{position:absolute;top:14px;right:14px;z-index:20;width:38px;height:38px;border-radius:var(--radius);background:rgba(0,0,0,.55);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:#fff;transition:.2s}
  .modal-close:hover{background:rgba(0,0,0,.85);border-color:var(--border-strong)}
  .modal-head{display:flex;gap:18px;align-items:center;padding:24px 28px 14px}
  .modal-face{width:84px;height:84px;min-width:84px;aspect-ratio:1/1;max-width:none;border-radius:50%;object-fit:cover;border:3px solid var(--border-strong);background:var(--surface-2);flex-shrink:0}
  .modal-head h2{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.02em}
  .modal-head .mnum{color:var(--accent);font-weight:600;font-size:14px;margin-top:4px}
  .modal-head .mtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .modal-section{padding:0 28px 14px}
  .modal-section h3{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .modal-section h3:before{content:"";width:16px;height:2px;background:var(--accent)}
  .testimonial{font-size:15px;line-height:1.6;color:var(--text);font-style:italic;border-left:2px solid var(--accent);padding-left:16px}
  .gallery-main{position:relative;width:100%;aspect-ratio:16/10;max-height:48vh;border-radius:var(--radius);overflow:hidden;background:var(--surface-2);margin-bottom:10px}
  .gallery-main #galMain{width:100%;height:100%;object-fit:contain;cursor:zoom-in}
  .gnav{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:44px;height:44px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:26px;line-height:1;transition:.2s;backdrop-filter:blur(4px)}
  .gnav:hover{background:var(--accent);color:#001018;border-color:var(--accent)}
  .gnav.prev{left:12px}.gnav.next{right:12px}
  .gallery-counter{position:absolute;top:12px;left:12px;z-index:6;background:rgba(0,0,0,.62);color:#fff;font-size:12px;font-weight:600;padding:5px 11px;border-radius:var(--radius);backdrop-filter:blur(4px)}
  .expand-btn{position:absolute;top:10px;right:10px;z-index:6;width:38px;height:38px;border-radius:var(--radius);background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center;transition:.2s;backdrop-filter:blur(4px)}
  .expand-btn:hover{background:var(--accent);color:#001018;border-color:var(--accent)}
  .thumbs{display:flex;gap:10px;flex-wrap:wrap}
  .thumb{width:84px;height:60px;border-radius:var(--radius);overflow:hidden;cursor:pointer;border:2px solid transparent;opacity:.55;transition:.2s;background:var(--surface-2)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb.active,.thumb:hover{opacity:1;border-color:var(--accent)}

  .fs-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center}
  .fs-overlay.open{display:flex}
  .fs-overlay img{max-width:94vw;max-height:90vh;width:auto;height:auto;object-fit:contain;cursor:default}
  .fs-close{position:absolute;top:20px;right:20px;z-index:10;width:46px;height:46px;border-radius:var(--radius);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center;transition:.2s}
  .fs-close:hover{background:rgba(255,255,255,.22)}
  .fs-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:54px;height:54px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:30px;line-height:1;transition:.2s}
  .fs-nav:hover{background:var(--accent);color:#001018;border-color:var(--accent)}
  .fs-nav.prev{left:24px}.fs-nav.next{right:24px}
  .fs-counter{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:600;padding:6px 14px;border-radius:var(--radius)}

  footer{border-top:1px solid var(--border);padding:48px 24px 40px;text-align:center;color:var(--muted);font-size:13px}
  footer .ftext{margin-top:8px}
  .footer-affil{margin-top:24px;padding-top:22px;border-top:1px solid var(--border);max-width:560px;margin-left:auto;margin-right:auto}
  .footer-affil .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .footer-affil .feds{margin-top:10px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:700;color:var(--text);letter-spacing:.04em}
  .footer-affil .feds span{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius)}
  footer .web{margin-top:22px}
  footer a{color:var(--accent);text-decoration:none}

  @media (max-width:768px){
    .header-inner{padding:13px 18px}
    main{padding:26px 18px 60px}
    .controls-inner{padding:14px 18px}
    .grid{gap:16px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
    .modal-head,.modal-section{padding-left:20px;padding-right:20px}
  }
  @media (max-width:560px){
    .controls{top:63px}
    .stats-inner{grid-template-columns:repeat(2,1fr);gap:4px 0;padding:24px 16px}
    .stat:nth-child(2){border-right:0}
    .stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid var(--border);padding-bottom:18px}
    .stat:nth-child(3),.stat:nth-child(4){padding-top:18px}
    .grid{grid-template-columns:1fr;gap:14px}
    .card .body{padding:13px}
    .modal-overlay{padding:0;align-items:flex-end}
    .modal{max-height:94vh;width:100%}
    .modal-head{padding:22px 18px 12px;gap:14px}
    .modal-face{width:64px;height:64px;min-width:64px}
    .gnav{width:40px;height:40px;font-size:22px}
    .thumb{width:64px;height:46px}
    .fs-nav{width:44px;height:44px;font-size:24px}
    .fs-nav.prev{left:12px}.fs-nav.next{right:12px}
  }
</style>
</head>
<body>

  <header class="site">
    <div class="header-inner">
      <a class="brand" href="#">
        <img src="logo.png" alt="dPhoto'SB"
             onerror="this.onerror=null;this.src='http://www.dphotosb.com/wp-content/uploads/2017/04/Nombre-y-Logo_galerias.png';this.onerror=function(){this.style.display='none';this.nextElementSibling.style.display='block'}">
        <span class="fallback" style="display:none">dPhoto<span>'SB</span></span>
      </a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-bg"><div class="grid-photos" id="heroBg"></div></div>
    <div class="hero-inner">
      <img class="hero-logo" src="logo.png" alt="dPhoto'SB"
           onerror="this.onerror=null;this.src='http://www.dphotosb.com/wp-content/uploads/2017/04/Nombre-y-Logo_galerias.png';this.onerror=function(){this.style.display='none';this.nextElementSibling.style.display='block'}">
      <div class="hero-logo-fb">dPhoto<span>'SB</span></div>
      <span class="kicker"><span class="dot"></span><span data-i18n="kicker"></span></span>
      <h1>10<span class="unit" data-i18n="years_unit"></span></h1>
      <p class="sub" data-i18n="hero_sub"></p>
    </div>
  </section>

  <section class="stats">
    <div class="stats-inner">
      <div class="stat"><b>10</b><span data-i18n="stat_years"></span></div>
      <div class="stat"><b id="statMembers">—</b><span data-i18n="stat_members"></span></div>
      <div class="stat"><b>IX</b><span data-i18n="stat_contests"></span></div>
      <div class="stat"><b>15+</b><span data-i18n="stat_expos"></span></div>
    </div>
  </section>

  <section class="about">
    <div class="about-inner">
      <span class="about-kicker" data-i18n="about_kicker"></span>
      <p class="about-text" data-i18n="about_text"></p>
    </div>
  </section>

  <section class="members-head">
    <h2 data-i18n="members_title"></h2>
    <p data-i18n="members_lead"></p>
  </section>

  <section class="controls">
    <div class="controls-inner">
      <div class="controls-row">
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" type="text" oninput="state.query=this.value;render()">
        </div>
        <select class="sort" id="sortSelect" onchange="state.sort=this.value;render()">
          <option value="num-asc"></option>
          <option value="num-desc"></option>
          <option value="name"></option>
        </select>
        <button class="clear-btn" id="clearBtn" onclick="clearFilters()"></button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <main>
    <p class="results-count" id="resultsCount"></p>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:4px">
      <img src="logo.png" alt="dPhoto'SB" style="height:52px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))"
           onerror="this.onerror=null;this.src='http://www.dphotosb.com/wp-content/uploads/2017/04/Nombre-y-Logo_galerias.png';this.onerror=function(){this.style.display='none'}">
    </div>
    <p class="ftext" data-i18n="footer_text"></p>
    <div class="footer-affil">
      <div class="label" data-i18n="footer_affil"></div>
      <div class="feds"><span>FCF</span><span>CEF</span><span>FIAP</span></div>
    </div>
    <p class="web"><a href="http://www.dphotosb.com/" target="_blank" rel="noopener">www.dphotosb.com</a></p>
  </footer>

  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="fs-overlay" id="fsOverlay" onclick="if(event.target===this)closeFs()">
    <button class="fs-close" onclick="closeFs()" aria-label="Tancar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <button class="fs-nav prev" onclick="event.stopPropagation();fsPrev()" aria-label="Anterior">&#8249;</button>
    <img id="fsImg" src="" alt="">
    <button class="fs-nav next" onclick="event.stopPropagation();fsNext()" aria-label="Seg&#252;ent">&#8250;</button>
    <div class="fs-counter"><span id="fsIdx">1</span>/<span id="fsTotal">1</span></div>
  </div>

<script>
/* ============================================================
   dPhoto'SB · 10e aniversari — Landing de socis

   GOOGLE SHEET: Publica el full com a CSV:
     Arxiu > Compartir > Publica al web > Format: CSV > Copia la URL
   Enganxa-la a SHEET_CSV_URL. Deixa-la buida ('') per usar les
   dades d'exemple.

   Columnes esperades al full (fila 1 = capcalera):
     num | name | themes | portrait | photo1 | photo2 | photo3 | photo4 | photo5 | testimonial

   - themes: claus separades per comes (ex: retrat,paisatge)
   - portrait: URL de la foto de perfil del soci
   - photo1...photo5: URLs de les obres (photo2-5 opcionals)
   - testimonial: text lliure
   ============================================================ */

const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTPqrZiqHZb3qRoDTrNfxecSBxtgqIWDSq0gvw3ZKXToswsKWnENV7xor8Bc1AZIpTrnmPtxYGq2bT7/pub?gid=0&single=true&output=csv';

/* ---------- TEMATIQUES ---------- */
const THEMES = {
  retrat:'Retrat', paisatge:'Paisatge', natura:'Natura', carrer:'Carrer',
  macro:'Macro', bodego:'Bodego', nocturna:'Nocturna', documental:'Documental',
  arquitectura:'Arquitectura', esports:'Esports', viatges:'Viatges',
  abstracta:'Abstracta', fauna:'Fauna', estenopeica:'Estenopeica', concerts:'Concerts',
};
const themeLabel = key => THEMES[key] || key;

/* ---------- TEXTOS ESTATICS ---------- */

  kicker:'Associació Grup Fotogràfic Santboià',

const THEME_KEYS = Object.keys(THEMES);
function seeded(s){return function(){s=(s*9301+49297)%233280;return s/233280}}
const rnd=seeded(7);
function pick(arr,r){return arr[Math.floor(r*arr.length)]}
function buildSampleMembers(){
  return SAMPLE_NAMES.map((name,i)=>{
    const num=i+1,nTh=1+Math.floor(rnd()*3),themes=[];
    while(themes.length<nTh){const th=pick(THEME_KEYS,rnd());if(!themes.includes(th))themes.push(th);}
    const nPh=3+Math.floor(rnd()*3),photos=[];
    for(let p=0;p<nPh;p++) photos.push('https://picsum.photos/seed/dpsb-'+num+'-'+p+'/1600/1067');
    return {num,name,themes,portrait:'https://i.pravatar.cc/300?img='+(((num-1)%70)+1),photos,testimonial:pick(SAMPLE_TESTIMONIALS,rnd())};
  });
}

/* ---------- CARREGA DES DE GOOGLE SHEET ---------- */
function parseCSV(text){
  // Normalitza salts de linia (Windows \r\n, Mac \r, Unix \n)
  const lines=text.trim().replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(l=>l.trim()!=='');
  if(lines.length<2){console.warn('CSV: menys de 2 línies',lines);return[];}
  const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,'').toLowerCase());
  console.log('CSV capçaleres detectades:',headers);
  console.log('CSV files de dades:',lines.length-1);
  const rows=lines.slice(1).map(line=>{
    const cols=[];let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){inQ=!inQ;}else if(ch===','&&!inQ){cols.push(cur.trim());cur='';}else{cur+=ch;}
    }
    cols.push(cur.trim());
    const row={};
    headers.forEach((h,i)=>row[h]=(cols[i]||'').replace(/^"|"$/g,'').trim());
    return row;
  });
  const valid=rows.filter(r=>r.name&&r.name.trim()!=='');
  console.log('CSV socis valids:',valid.length,'de',rows.length);
  return valid;
}
function rowToMember(row){
  const photos=[row.photo1,row.photo2,row.photo3,row.photo4,row.photo5].filter(Boolean);
  const themes=(row.themes||'').split(',').map(s=>s.trim()).filter(Boolean);
  return {
    num:parseInt(row.num,10)||0,
    name:row.name||'',
    themes:themes.length?themes:['retrat'],
    portrait:row.portrait||'https://i.pravatar.cc/300?img=1',
    photos:photos.length?photos:['https://picsum.photos/seed/dpsb-'+row.num+'-0/1600/1067'],
    testimonial:row.testimonial||''
  };
}
// Proxy CORS necessari quan el fitxer s'obre des de local (file://)
const CORS_PROXY = 'https://corsproxy.io/?';

async function fetchCSV(url){
  // Primer intent: directe (funciona si s'allotja en un servidor web)
  try{
    const r=await fetch(url,{cache:'no-cache'});
    if(r.ok)return await r.text();
  }catch(_){}
  // Segon intent: via proxy CORS (funciona en local)
  const r2=await fetch(CORS_PROXY+encodeURIComponent(url),{cache:'no-cache'});
  if(!r2.ok)throw new Error('HTTP '+r2.status);
  return await r2.text();
}

async function loadSheet(){
  if(!SHEET_CSV_URL)return buildSampleMembers();
  try{
    const text=await fetchCSV(SHEET_CSV_URL);
    const rows=parseCSV(text);
    if(!rows.length)throw new Error('Full buit o sense dades');
    return rows.map(rowToMember).filter(m=>m.name);
  }catch(err){
    console.error('Error carregant el Google Sheet:',err);
    document.getElementById('grid').innerHTML='<div class="empty" style="grid-column:1/-1">'+t('load_error')+'</div>';
    return [];
  }
}

/* ---------- ESTAT ---------- */
const state={query:'',activeThemes:new Set(),sort:'num-asc'};
let MEMBERS=[];
let galState={photos:[],idx:0};

const pad=n=>String(n).padStart(3,'0');
function presentThemes(){const s=new Set();MEMBERS.forEach(m=>m.themes.forEach(th=>s.add(th)));return[...s].sort((a,b)=>themeLabel(a).localeCompare(themeLabel(b),'ca'));}

function applyStaticTexts(){
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.getElementById('searchInput').placeholder=t('search_ph');
  const ss=document.getElementById('sortSelect');
  ss.options[0].textContent=t('sort_num_asc');ss.options[1].textContent=t('sort_num_desc');ss.options[2].textContent=t('sort_name');
  document.getElementById('clearBtn').textContent=t('clear');
  document.getElementById('statMembers').textContent=MEMBERS.length||'—';
}
function clearFilters(){state.query='';state.activeThemes.clear();state.sort='num-asc';document.getElementById('searchInput').value='';document.getElementById('sortSelect').value='num-asc';render();}
function toggleTheme(key){state.activeThemes.has(key)?state.activeThemes.delete(key):state.activeThemes.add(key);render();}
function filtered(){
  const q=state.query.trim().toLowerCase();
  let list=MEMBERS.filter(m=>{
    const matchQ=!q||m.name.toLowerCase().includes(q)||String(m.num).includes(q)||pad(m.num).includes(q);
    const matchT=state.activeThemes.size===0||m.themes.some(th=>state.activeThemes.has(th));
    return matchQ&&matchT;
  });
  if(state.sort==='num-asc')list.sort((a,b)=>a.num-b.num);
  else if(state.sort==='num-desc')list.sort((a,b)=>b.num-a.num);
  else if(state.sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'ca'));
  return list;
}
function renderChips(){
  const c=document.getElementById('chips');
  let html='<span class="chips-label">'+t('chips_label')+'</span>';
  presentThemes().forEach(key=>{const active=state.activeThemes.has(key)?'active':'';html+='<button class="chip '+active+'" onclick="toggleTheme(\''+key+'\')">'+themeLabel(key)+'</button>';});
  c.innerHTML=html;
}
function renderGrid(){
  const list=filtered();const grid=document.getElementById('grid');
  document.getElementById('resultsCount').innerHTML='<b>'+list.length+'</b> '+t('results');
  if(list.length===0){grid.innerHTML='<div class="empty" style="grid-column:1/-1">'+t('no_results')+'</div>';return;}
  grid.innerHTML=list.map(m=>`
    <article class="card" onclick="openModal(${m.num})">
      <div class="featured"><img class="work" src="${m.photos[0]}" alt="Obra de ${m.name}" loading="lazy"></div>
      <div class="body">
        <img class="avatar" src="${m.portrait}" alt="${m.name}" loading="lazy">
        <div class="info">
          <div class="name">${m.name}</div>
          <div class="member-num">${t('member')} ${pad(m.num)}</div>
          <div class="tags">${m.themes.map(th=>`<span class="tag">${themeLabel(th)}</span>`).join('')}</div>
        </div>
      </div>
    </article>`).join('');
}
function render(){renderChips();renderGrid();}

/* ---------- MODAL ---------- */
function openModal(num){

  galState={photos:m.photos,idx:0};

  document.getElementById('modal').innerHTML=`
    <button class="modal-close" onclick="closeModal()" aria-label="Tancar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="modal-head">
      <img class="modal-face" src="${m.portrait}" alt="${m.name}">
      <div>
        <h2>${m.name}</h2>
        <div class="mnum">${t('member')} ${pad(m.num)}</div>
        <div class="mtags">${m.themes.map(th=>`<span class="tag">${themeLabel(th)}</span>`).join('')}</div>
      </div>
    </div>
    <div class="modal-section">
      <h3>${t('m_gallery')}</h3>
      <div class="gallery-main">
        <img id="galMain" src="${m.photos[0]}" alt="Obra de ${m.name}" onclick="openFs()">
        <button class="expand-btn" onclick="openFs()" aria-label="Pantalla completa">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>
        </button>
        ${multi?`
        <div class="gallery-counter"><span id="galIdx">1</span>/${m.photos.length}</div>
        <button class="gnav prev" onclick="galPrev()" aria-label="Anterior">&#8249;</button>
        <button class="gnav next" onclick="galNext()" aria-label="Seg&#252;ent">&#8250;</button>`:''}
      </div>
      <div class="thumbs">${m.photos.map((p,i)=>`<div class="thumb ${i===0?'active':''}" onclick="galShow(${i})"><img src="${p}" alt=""></div>`).join('')}</div>
    </div>
    ${m.testimonial?`<div class="modal-section"><h3>${t('m_testimonial')}</h3><p class="testimonial">“${m.testimonial}”</p></div>`:''}`;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function galShow(i){
  const n=galState.photos.length;if(!n)return;galState.idx=(i+n)%n;
  const main=document.getElementById('galMain');if(main)main.src=galState.photos[galState.idx];
  const idxEl=document.getElementById('galIdx');if(idxEl)idxEl.textContent=galState.idx+1;
  document.querySelectorAll('.thumb').forEach((el,k)=>el.classList.toggle('active',k===galState.idx));
}
function galPrev(){galShow(galState.idx-1)}
function galNext(){galShow(galState.idx+1)}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');document.body.style.overflow='';}
function modalOpen(){return document.getElementById('modalOverlay').classList.contains('open')}

/* ---------- PANTALLA COMPLETA ---------- */
function openFs(){if(!galState.photos.length)return;document.getElementById('fsTotal').textContent=galState.photos.length;fsShow(galState.idx);document.getElementById('fsOverlay').classList.add('open');}
function fsShow(i){
  const n=galState.photos.length;if(!n)return;galState.idx=(i+n)%n;
  document.getElementById('fsImg').src=galState.photos[galState.idx];
  document.getElementById('fsIdx').textContent=galState.idx+1;
  const main=document.getElementById('galMain');if(main)main.src=galState.photos[galState.idx];
  const idxEl=document.getElementById('galIdx');if(idxEl)idxEl.textContent=galState.idx+1;
  document.querySelectorAll('.thumb').forEach((el,k)=>el.classList.toggle('active',k===galState.idx));
}
function fsPrev(){fsShow(galState.idx-1)}
function fsNext(){fsShow(galState.idx+1)}
function closeFs(){document.getElementById('fsOverlay').classList.remove('open')}
function fsOpen(){return document.getElementById('fsOverlay').classList.contains('open')}

document.addEventListener('keydown',e=>{
  if(fsOpen()){if(e.key==='Escape')closeFs();else if(e.key==='ArrowLeft')fsPrev();else if(e.key==='ArrowRight')fsNext();return;}
  if(!modalOpen())return;
  if(e.key==='Escape')closeModal();else if(e.key==='ArrowLeft')galPrev();else if(e.key==='ArrowRight')galNext();
});

function buildHeroBg(){const bg=document.getElementById('heroBg');let html='';for(let i=0;i<36;i++)html+='<div style="background-image:url(\'https://picsum.photos/seed/herodpsb-'+i+'/300/300\')"></div>';bg.innerHTML=html;}

/* ---------- INIT ---------- */
async function init(){
  buildHeroBg();
  applyStaticTexts();
  document.getElementById('grid').innerHTML='<div class="empty" style="grid-column:1/-1">'+t('loading')+'</div>';
  MEMBERS=await loadSheet();
  applyStaticTexts();
  render();
}
init();
</script>
